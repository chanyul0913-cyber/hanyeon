<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>合緣 합연 — 우리 사주 궁합</title>
<meta name="description" content="두 사람의 사주 일주를 비교해 일별 속궁합·피크·합궁을 보여 주는 비공개 궁합 사이트">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230b0f1a'/%3E%3Ctext x='32' y='42' font-size='34' text-anchor='middle' fill='%23d4af37'%3E合%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" integrity="sha384-GIdEBaqGN9mNkDkMkzMHW8EKUqtpPIe/sLj1X7DIrnc9uPtLROJgmuDlh+3rBw0j" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;900&display=swap">
<link rel="stylesheet" href="style.css?v=9">
</head>
<body>

<div id="app">
  <header class="hd">
    <div class="brand"><span class="brand-mark">合</span><b>合緣 합연</b><small>두 사람의 사주가 만나는 날</small></div>
    <div class="hd-btns">
      <button id="btnShare" title="상대에게 공유 링크 복사">🔗 공유</button>
      <button id="btnSettings" title="생년월일 설정">⚙ 설정</button>
    </div>
  </header>

  <nav class="tabbar" id="tabbar">
    <button data-tab="home" class="on">오늘</button>
    <button data-tab="consult">운세 상담</button>
    <button data-tab="daily">일별 궁합</button>
    <button data-tab="luck">재물·애정운</button>
    <button data-tab="tojeong">토정비결</button>
    <button data-tab="shinjeom">신점</button>
    <button data-tab="tarot">타로</button>
    <button data-tab="myeongban">명반</button>
    <button data-tab="couple">궁합 분석</button>
    <button data-tab="western">서양 점성술</button>
  </nav>

  <main>
    <!-- 오늘 -->
    <section id="tab-home" class="tab on">
      <div id="homeToday"></div>
      <div id="homePeak"></div>
      <div id="homeFlow"></div>
    </section>

    <!-- 운세 상담 -->
    <section id="tab-consult" class="tab" hidden>
      <div id="consultBody"></div>
    </section>

    <!-- 명반 -->
    <section id="tab-myeongban" class="tab" hidden>
      <div class="grid2" id="myeongbanCards"></div>
    </section>

    <!-- 궁합 분석 -->
    <section id="tab-couple" class="tab" hidden>
      <div id="coupleTop"></div>
      <div id="couplePeak"></div>
      <div id="coupleParts"></div>
      <div id="coupleOh"></div>
    </section>

    <!-- 일별 궁합 -->
    <section id="tab-daily" class="tab" hidden>
      <div class="daily-head">
        <button id="calPrev">◀</button>
        <div id="calTitle">—</div>
        <button id="calNext">▶</button>
      </div>
      <div class="chips" id="dailyFilters">
        <label style="border-color:rgba(240,196,70,.9)"><input type="checkbox" id="fPeak" checked> <span style="color:#f5c842">⭐ 피크</span></label>
        <label style="border-color:rgba(95,185,138,.6)"><input type="checkbox" id="fHerStrong" checked> <span style="color:var(--good)">✿ 합궁</span></label>
        <label style="border-color:rgba(243,156,60,.7)"><input type="checkbox" id="fWestHap" checked> <span style="color:#f39c3c">✿ 서양합궁</span></label>
        <label style="border-color:rgba(255,70,70,.9)"><input type="checkbox" id="fDanger" checked> <span style="color:#ff4a4a">⚡ 최고 위험</span></label>
        <label style="border-color:rgba(169,139,240,.7)"><input type="checkbox" id="fLotto1" checked> <span id="fLotto1Lbl" style="color:#a98bf0">🍀 로또</span></label>
        <label style="border-color:rgba(169,139,240,.7)"><input type="checkbox" id="fLotto2" checked> <span id="fLotto2Lbl" style="color:#a98bf0">🍀 로또</span></label>
      </div>
      <div id="calGrid" class="cal"></div>
      <div class="legend" id="calLegend"></div>
      <div id="dailySummary"></div>
    </section>

    <!-- 서양 점성술 -->
    <section id="tab-western" class="tab" hidden>
      <div id="westernCards"></div>
      <div id="westernSynastry"></div>
    </section>

    <!-- 월별 재물운·애정운 -->
    <section id="tab-luck" class="tab" hidden>
      <div class="daily-head"><button id="luckPrev">◀</button><div id="luckTitle">—</div><button id="luckNext">▶</button></div>
      <div id="luckBody"></div>
    </section>

    <!-- 토정비결 -->
    <section id="tab-tojeong" class="tab" hidden>
      <div class="daily-head"><button id="tjPrev">◀</button><div id="tjTitle">—</div><button id="tjNext">▶</button></div>
      <div id="tjBody"></div>
    </section>

    <!-- 타로 -->
    <section id="tab-tarot" class="tab" hidden>
      <div id="tarotBody"></div>
    </section>

    <!-- 신점 (오방기 뽑기) -->
    <section id="tab-shinjeom" class="tab" hidden>
      <div class="daily-head"><button id="sjPrev">◀</button><div id="sjTitle">—</div><button id="sjNext">▶</button></div>
      <div id="sjBody"></div>
    </section>
  </main>

  <footer class="ft">
    <div>合緣 합연 — 명리(四柱八字)와 점성술로 보는 두 사람의 일상 · 비공개 사이트</div>
    <div class="ft-sub">해석은 전통 명리 규칙(천간합·지지 육합·십신·오행 생극)을 근거로 한 근사치이며 재미와 소통용 참고자료입니다.</div>
  </footer>
</div>

<!-- 설정 모달 -->
<div id="modalSettings" class="modal" hidden>
  <div class="modal-card">
    <div class="modal-hd"><b>두 사람의 생년월일 설정</b><button class="modal-x" data-close>✕</button></div>
    <p class="modal-note">기준: 왼쪽은 남자, 오른쪽은 여자 — 남·여 커플 구조(남자의 재성=여자 운, 여자의 관성=남자 운)로 해석합니다. 누가 입력하든 남자는 남자 칸, 여자는 여자 칸에 넣으세요. 입력 정보는 이 브라우저에만 저장됩니다.</p>
    <div class="grid2">
      <form id="form1" class="person-form" onsubmit="return false">
        <h3>남자</h3>
        <label>이름 <input name="name" placeholder="남자 이름"></label>
        <label>생년월일 <span class="ymd"><input name="y" type="number" min="1900" max="2100" placeholder="1990"><input name="m" type="number" min="1" max="12" placeholder="5"><input name="d" type="number" min="1" max="31" placeholder="15"></span></label>
        <label class="inl">달력 <label><input type="radio" name="cal" value="solar" checked> 양력</label><label><input type="radio" name="cal" value="lunar"> 음력</label></label>
        <label class="inl chk"><input type="checkbox" name="leap"> 음력 윤달</label>
        <label class="inl chk"><input type="checkbox" name="nohour"> 태어난 시간 모름</label>
        <label>시각 <span class="hm"><input name="h" type="number" min="0" max="23" placeholder="10">시 <input name="mi" type="number" min="0" max="59" placeholder="30">분</span></label>
      </form>
      <form id="form2" class="person-form" onsubmit="return false">
        <h3>여자</h3>
        <label>이름 <input name="name" placeholder="여자 이름"></label>
        <label>생년월일 <span class="ymd"><input name="y" type="number" min="1900" max="2100" placeholder="1993"><input name="m" type="number" min="1" max="12" placeholder="2"><input name="d" type="number" min="1" max="31" placeholder="3"></span></label>
        <label class="inl">달력 <label><input type="radio" name="cal" value="solar" checked> 양력</label><label><input type="radio" name="cal" value="lunar"> 음력</label></label>
        <label class="inl chk"><input type="checkbox" name="leap"> 음력 윤달</label>
        <label class="inl chk"><input type="checkbox" name="nohour"> 태어난 시간 모름</label>
        <label>시각 <span class="hm"><input name="h" type="number" min="0" max="23" placeholder="14">시 <input name="mi" type="number" min="0" max="59" placeholder="0">분</span></label>
      </form>
    </div>
    <div id="setMsg" class="set-msg"></div>
    <div class="modal-btns">
      <button id="btnSaveProfile" class="primary">저장하고 계산하기</button>
    </div>
  </div>
</div>

<!-- 일별 상세 모달 -->
<div id="modalDay" class="modal" hidden>
  <div class="modal-card" id="dayDetail"></div>
</div>

<script src="js/vendor/lunar.js"></script>
<script src="js/vendor/astronomy.js"></script>
<script src="js/engine.js?v=38"></script>
<script src="js/app.js?v=40"></script>
<script src="js/chart.js?v=21"></script>
<script src="js/couple.js?v=22"></script>
<script src="js/daily.js?v=35"></script>
<script src="js/western.js?v=39"></script>
<script src="js/luck.js?v=22"></script>
<script src="js/tojeong.js?v=35"></script>
<script src="js/tarot.js?v=36"></script>
<script src="js/shinjeom.js?v=33"></script>
<script src="js/consult.js?v=23"></script>
<script src="js/selftest.js?v=39"></script>
</body>
</html>
